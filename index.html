<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soul Affinity Quiz</title>
<meta name="description" content="Have your soul's resonance read before you wake in Vaeloria. Sixty-six questions. No right answers.">
<meta property="og:title" content="Soul Affinity Quiz">
<meta property="og:description" content="Have your soul's resonance read before you wake in Vaeloria. No right answers.">
<meta property="og:image" content="guild.png">
<link rel="icon" href="guild.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<canvas id="embers" aria-hidden="true"></canvas>

<header class="top">
  <img class="crest" src="guild.png" alt="" width="72" height="72">
  <h1>Soul Affinity Quiz</h1>
  <div class="tools">
    <button id="btn-audio" class="tool" type="button" aria-pressed="true" title="Sound">♪ on</button>
    <button id="btn-restart" class="tool" type="button" title="Start over">↺</button>
  </div>
</header>

<main id="stage" class="stage" aria-live="polite">

  <!-- Splash -->
  <section id="s-splash" class="screen hidden">
    <div class="box dialog splash-box">
      <p class="say" id="splash-text"></p>
    </div>
    <div class="box answers" id="splash-choices"></div>
  </section>

  <!-- Dialogue (intro tree and interludes) -->
  <section id="s-talk" class="screen hidden">
    <div class="box dialog talk-box" id="talk-box">
      <div class="say" id="talk-text"></div>
    </div>
    <div class="box answers" id="talk-choices"></div>
  </section>

  <!-- Question -->
  <section id="s-question" class="screen hidden">
    <div class="progress">
      <span id="counter" class="counter">01 / 66</span>
      <div class="bar"><div id="bar-fill" class="fill"></div></div>
    </div>
    <div class="box dialog">
      <p class="say" id="q-text"></p>
    </div>
    <div class="box answers" id="answers"></div>
    <p class="hint keys">↑ ↓ or ← → move · 1–6 jump · Z or Enter confirm · X back</p>
  </section>

  <!-- Result -->
  <section id="s-result" class="screen hidden">
    <div class="box dialog">
      <p class="say" id="r-resonance"></p>
    </div>
    <div class="box result-head">
      <div class="glyph" id="r-glyph"></div>
      <h2 id="r-name"></h2>
    </div>
    <div class="box dialog">
      <p class="say" id="r-reading"></p>
    </div>
    <div class="box">
      <p class="means" id="r-means"></p>
      <p class="hook" id="r-hook"></p>
    </div>
    <div class="box">
      <p class="label">How your soul leans</p>
      <div class="bars" id="r-bars"></div>
      <p class="magnitude" id="r-magnitude"></p>
    </div>
    <div class="box actions row">
      <button id="btn-copy" class="plain" type="button">Copy result</button>
      <button id="btn-again" class="plain" type="button">Be read again</button>
    </div>
  </section>

</main>

<footer class="foot">
  <span>The Adventurers Guild · Vaeloria</span>
  <a class="discord" href="https://discord.gg/TZgBqacT7e" target="_blank" rel="noopener">Join the Discord</a>
</footer>

<script src="questions.js?v=5"></script>
<script src="scoring.js?v=5"></script>
<script src="souls.js?v=5"></script>
<script src="audio.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
